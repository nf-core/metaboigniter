lint:
  files_exist:
    - .github/workflows/linting_comment.yml
  files_unchanged:
    # Sets NXF_SYNTAX_PARSER=v1 until the pipeline passes the strict parser
    - .github/workflows/linting.yml
    - .github/workflows/branch.yml
    # The template logos render differently per machine
    - docs/images/nf-core-metaboigniter_logo_light.png
    - docs/images/nf-core-metaboigniter_logo_dark.png
nf_core_version: 3.5.2
repository_type: pipeline
template:
  author: Payam Emami
  description: Pre-processing of mass spectrometry-based metabolomics data
  force: false
  is_nfcore: true
  name: metaboigniter
  org: nf-core
  outdir: .
  version: 2.1.0dev
